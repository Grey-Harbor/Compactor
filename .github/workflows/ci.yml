name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag compactor:ci .

      - name: Smoke test production image
        run: |
          set -euo pipefail
          events_dir="$RUNNER_TEMP/compactor-events"
          mkdir -p "$events_dir"
          chmod 0777 "$events_dir"

          docker run --detach \
            --name compactor-ci \
            --publish 18080:8080 \
            --mount "type=bind,source=$PWD/examples/redirects.json,target=/etc/compactor/redirects.json,readonly" \
            --mount "type=bind,source=$events_dir,target=/var/lib/compactor" \
            compactor:ci
          cleanup() {
            docker rm --force compactor-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker inspect --format '{{.Config.User}}' compactor-ci)" = "10001:10001"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" = 20 ]]; then
              docker logs compactor-ci
              exit 1
            fi
            sleep 1
          done
          docker exec compactor-ci \
            curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: localhost:8080' \
            'http://127.0.0.1:18080/project?from=ci')"
          test "$status" = "302"
          grep --quiet '"outcome":"redirected"' "$events_dir/events.jsonl"

          docker stop --timeout 10 compactor-ci
          docker logs compactor-ci >"$RUNNER_TEMP/compactor.log" 2>&1
          grep --quiet 'Compactor stopped' "$RUNNER_TEMP/compactor.log"
          docker rm compactor-ci

          cargo build --locked --example http_adapter_mock
          MOCK_BIND_ADDRESS=0.0.0.0:19090 \
            target/debug/examples/http_adapter_mock \
            >"$RUNNER_TEMP/http-mock.log" 2>&1 &
          mock_pid="$!"
          docker run --detach \
            --name compactor-http-ci \
            --publish 18081:8080 \
            --add-host host.docker.internal:host-gateway \
            --env COMPACTOR_SOURCE_TYPE=http \
            --env COMPACTOR_HTTP_SOURCE_URL=http://host.docker.internal:19090/resolve \
            --env COMPACTOR_EVENT_SINK_TYPE=http \
            --env COMPACTOR_HTTP_EVENT_SINK_URL=http://host.docker.internal:19090/events \
            compactor:ci
          cleanup_http() {
            docker rm --force compactor-http-ci >/dev/null 2>&1 || true
            kill "$mock_pid" >/dev/null 2>&1 || true
          }
          trap cleanup_http EXIT
          for attempt in {1..20}; do
            status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --header 'Host: go.example' \
              http://127.0.0.1:18081/docs || true)"
            if [[ "$status" = 308 ]]; then
              break
            fi
            if [[ "$attempt" = 20 ]]; then
              docker logs compactor-http-ci
              cat "$RUNNER_TEMP/http-mock.log"
              exit 1
            fi
            sleep 1
          done
          grep --quiet 'Redirected' "$RUNNER_TEMP/http-mock.log"
          docker stop --timeout 10 compactor-http-ci
          docker rm compactor-http-ci
          kill "$mock_pid"
          trap - EXIT

  website:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: site

      - name: Check website types
        run: npm run check
        working-directory: site

      - name: Build static website
        run: npm run build
        working-directory: site

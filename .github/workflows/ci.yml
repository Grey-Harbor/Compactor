name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust 1.85
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --component clippy,rustfmt
          rustup default 1.85.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: docker build --tag compactor:ci .

      - name: Smoke test production image
        run: |
          set -euo pipefail
          events_dir="$RUNNER_TEMP/compactor-events"
          mkdir -p "$events_dir"
          chmod 0777 "$events_dir"

          docker run --detach \
            --name compactor-ci \
            --publish 18080:8080 \
            --mount "type=bind,source=$PWD/examples/redirects.json,target=/etc/compactor/redirects.json,readonly" \
            --mount "type=bind,source=$events_dir,target=/var/lib/compactor" \
            compactor:ci
          cleanup() {
            docker rm --force compactor-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          test "$(docker inspect --format '{{.Config.User}}' compactor-ci)" = "10001:10001"
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            if [[ "$attempt" = 20 ]]; then
              docker logs compactor-ci
              exit 1
            fi
            sleep 1
          done
          docker exec compactor-ci \
            curl --fail --silent http://127.0.0.1:8080/healthz >/dev/null

          status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header 'Host: localhost:8080' \
            'http://127.0.0.1:18080/project?from=ci')"
          test "$status" = "302"
          grep --quiet '"outcome":"redirected"' "$events_dir/events.jsonl"

          docker stop --timeout 10 compactor-ci
          docker logs compactor-ci >"$RUNNER_TEMP/compactor.log" 2>&1
          grep --quiet 'Compactor stopped' "$RUNNER_TEMP/compactor.log"
          docker rm compactor-ci
          trap - EXIT

  website:
    name: Verify website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install website dependencies
        run: npm ci
        working-directory: site

      - name: Check website types
        run: npm run check
        working-directory: site

      - name: Build static website
        run: npm run build
        working-directory: site
